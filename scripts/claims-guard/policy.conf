# claims-guard policy — synced verbatim into every product repo by sync.sh.
# Editing a copy under repos/*/scripts/claims-guard/ is a drift failure; edit
# THIS file and run `make claims-guard-sync`.

# Hosts the product is allowed to reach at runtime. Anything else needs a
# reviewed `.claims-allow` line naming why it is in the data path.
ALLOWED_HOSTS=(
  beebeeb.io www.beebeeb.io app.beebeeb.io api.beebeeb.io admin.beebeeb.io
  status.beebeeb.io cdn.beebeeb.io
  errors.beebeeb.io   # self-hosted GlitchTip ingest on app02 (pre-mortem item 07); added to both web CSPs
  api.mollie.com my.mollie.com
  localhost 127.0.0.1 0.0.0.0 10.0.2.2
)

# Hard deny-list: hosts that must never appear in a runtime surface, whatever
# the syntax around them. `pwnedpasswords` is here because task 0995 purged it
# and commit 626bd82 put it back nine days later.
DENIED_ORIGINS='pwnedpasswords\.com|cloudflare\.com|cloudflareinsights|challenges\.cloudflare|cdnjs\.cloudflare|unpkg\.com|cdn\.jsdelivr\.net|fonts\.googleapis\.com|fonts\.gstatic\.com|google-analytics\.com|googletagmanager\.com|sentry\.io|ingest\.sentry|postmarkapp\.com|api\.sendgrid\.com|mailgun\.(net|org)|amazonaws\.com|vercel\.app|netlify\.app|hcaptcha\.com|recaptcha\.net'

# Hosting-provider names. Allowed ONLY on the legal sub-processors page and the
# DPA (both allow-listed in repos/site/.claims-allow).
PROVIDER_NAMES='Hetzner|Leaseweb|OVHcloud|Scaleway|Contabo|Vultr|DigitalOcean|your-objectstorage\.com'

# Claims that require evidence we do not have yet. Removing one from this list
# requires a published artefact (an audit report, a certificate), not an opinion.
#
# The audit tokens are pre-mortem item 03's canon regex VERBATIM
# (docs/canon/public-claims.md): "audited (Rust|core|by)" and "audited 20YY".
# A bare "audited" is deliberately NOT here — it would flag the honest
# sentences item 03 writes ("has not been externally audited", "not yet been
# audited") and the true statements about competitors in
# repos/site/src/lib/comparisons.ts ("Audited (Securitum)"). "Unlimited version
# history" comes from pre-mortem item 08 (the catalog sells it, nothing enforces it).
#
# PORTABILITY: no `\b`. `git grep -E` on macOS (git 2.55, libc regex) matches
# ZERO lines for `\baudited\b` while ubuntu-latest matches — a `\b` token would
# pass silently in the local pre-commit hook and fail only in CI. Word
# boundaries are spelled with POSIX classes instead.
BANNED_CLAIMS='audited (Rust|core|by)|audited 20[0-9]{2}|(^|[^[:alnum:]_])DORA([^[:alnum:]_]|$)|bank-grade|military-grade|ISO ?27001|SOC ?2|NIS2 compliant|GDPR compliant|penetration test|Unlimited version history'

# Claims that are true only with more than one live region.
MULTI_REGION_CLAIMS='jurisdiction of choice|choose your region|region of your choice|pick your( data)? region'

# Non-live region names that must never appear in product copy — a fixed list
# per docs/canon/data-residency.md's own enforcement line, independent of
# LIVE_REGIONS. When a region activates, remove its name here in the SAME
# commit that adds it to LIVE_REGIONS (canon activation runbook step).
PHANTOM_REGIONS='helsinki|(^|[^[:alnum:]_])ede([^[:alnum:]_]|$)|nuremberg'   # no `\b` — see BANNED_CLAIMS

# Regions with a live storage pool. Mirrors the claims-guard:live-regions block
# in docs/canon/data-residency.md; step 3 of that file's activation runbook is
# "add the region here".
LIVE_REGIONS=(falkenstein)

# Where a runtime network call can hide.
#
# `src`, `public`, `packages` are git glob pathspecs (`:(glob)**/x/**`), not
# bare names — a bare pathspec only matches a TOP-LEVEL dir (git prefix-
# matches literal, non-wildcard pathspecs from repo root), so a Cargo
# workspace's nested crates (`beebeeb-api/src`, `beebeeb-status/src`, ...) or
# an npm workspace's `packages/*/src` are invisible to a bare `src` entry.
# The glob form covers any depth in every repo. `index.html`/`README.md`/
# `app.json` stay bare/root-only on purpose — they name the ONE trust
# document per repo (root README, root index.html), not every incidental
# `scripts/*/README.md` or vendored `app.json`.
RUNTIME_PATHS=(
  ':(glob)**/src/**' ':(glob)**/public/**' ':(glob)**/packages/**'
  index.html nginx.conf app.json app.config.js
  astro.config.mjs metro.config.js Dockerfile Dockerfile.deploy
  '*.env.example' '*.env.template'
)

# Where user-facing copy lives. Same glob-vs-bare reasoning as RUNTIME_PATHS.
USER_FACING_PATHS=( ':(glob)**/src/**' ':(glob)**/public/**' ':(glob)**/packages/**' index.html README.md app.json )

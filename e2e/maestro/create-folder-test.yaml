appId: io.beebeeb.app
---
- launchApp

# Should be on Files tab (already logged in)
- extendedWaitUntil:
    visible: "Drive"
    timeout: 10000

- takeScreenshot: "folder-01-drive"

# Tap the FAB (+) button at bottom right.
# Was a point tap at 87%,87%; the 1312 floating tab bar is taller than the old
# flush one, so the shorter scene moved the FAB up ~20pt and the point missed.
# The FAB has always carried testID="fab-add" — use it, so layout changes
# cannot silently break this flow again.
- tapOn:
    id: "fab-add"

# Assert folder creation dialog appears
- extendedWaitUntil:
    visible: "New folder"
    timeout: 5000

- takeScreenshot: "folder-02-create-dialog"

appId: io.beebeeb.app
---
- launchApp

# Should be on Files tab (already logged in)
- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

# Navigate to Settings tab
- tapOn:
    id: "tab-settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

# Scroll until "Add a device" row appears (Devices section since the 1296 reorg)
- scrollUntilVisible:
    element:
      text: "Add a device"
    direction: DOWN
    timeout: 10000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- takeScreenshot: "device-pairing-01-settings-row"

- tapOn: "Add a device"

# DevicePairingScreen: two cards — "Scan with this device" and "Show on this device"
- extendedWaitUntil:
    visible: "Show on this device"
    timeout: 5000

- takeScreenshot: "device-pairing-02-pairing-options"

# Open the Show flow → Amber Constellation WebView renders the pattern
- tapOn: "Show on this device"

# DevicePairingShowScreen. The old assertion claimed "the header label is the
# same" — it is not, and never was: this screen has no such header. It shows
# "Waiting for another device…", which is also the better assertion because it
# proves the pairing session actually STARTED rather than that a screen merely
# rendered.
# The trailing .* is load-bearing: the real string ends in an ellipsis
# ("Waiting for another device…") and Maestro's text selector is a FULL-match
# regex, so the bare prefix does not match. Fourth instance of that trap in
# this suite, after "With me 0", "By me 6" and "Dark theme".
- extendedWaitUntil:
    visible: "Waiting for another device.*"
    timeout: 8000

- takeScreenshot: "device-pairing-03-constellation"

# Back to DevicePairingScreen. The old assertion looked for "Add a device",
# which is the SETTINGS row — one screen further back than we are.
- tapOn: "Back"

- extendedWaitUntil:
    visible: "Show on this device"
    timeout: 5000

# Back to Settings
- tapOn: "Back"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

- takeScreenshot: "device-pairing-04-back-in-settings"

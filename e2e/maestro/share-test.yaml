appId: io.beebeeb.app
---
- launchApp

# Make sure we're signed in (Files tab visible)
- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

# Navigate to Shared tab.
# 1308d — task 1360: `id: "tab-shared"` against the native SwiftUI tab bar
# (1308a) is unreliable here — a hard "Element not found" even though
# `maestro hierarchy` dumped moments earlier shows `resource-id: "tab-shared"`
# genuinely present. A plain TEXT selector on the tab's own label resolved and
# tapped correctly 3/3 runs with zero waiting instead — see login-test.yaml
# for the full live comparison (repeat/wait wrappers tried and ruled out) and
# docs/maestro-driver-fault-1360.md for the general fault this native-tab-bar
# variant sits beside.
- tapOn: "Shared"

# Two segmented tabs. Renamed in-product to "With me.*" / "By me.*"
# (SharedScreen dirTabs); this flow still asserted the old strings.
- extendedWaitUntil:
    visible: "With me.*"
    timeout: 5000

- assertVisible: "With me.*"
- assertVisible: "By me.*"

- takeScreenshot: "share-01-incoming"

# Switch to "By me.*"
- tapOn: "By me.*"

- extendedWaitUntil:
    visible: "By me.*"
    timeout: 5000

- takeScreenshot: "share-02-outgoing"

# Back to "With me.*" and try to tap the first row if any items exist.
- tapOn: "With me.*"

- extendedWaitUntil:
    visible: "With me.*"
    timeout: 5000

# Optional: tap the first list row by coordinate. If the demo account has no
# inbound shares, this falls on the empty-state copy and is harmless.
- tapOn:
    point: "50%,35%"

- takeScreenshot: "share-03-after-tap"

appId: io.beebeeb.app
---
- launchApp

# Make sure we're signed in (Files tab visible)
- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

# Navigate to Shared tab
- tapOn:
    id: "tab-shared"

# Two segmented tabs. Renamed in-product to "With me.*" / "By me.*"
# (SharedScreen dirTabs); this flow still asserted the old strings.
- extendedWaitUntil:
    visible: "With me.*"
    timeout: 5000

- assertVisible: "With me.*"
- assertVisible: "By me.*"

- takeScreenshot: "share-01-incoming"

# Switch to "By me.*"
- tapOn: "By me.*"

- extendedWaitUntil:
    visible: "By me.*"
    timeout: 5000

- takeScreenshot: "share-02-outgoing"

# Back to "With me.*" and try to tap the first row if any items exist.
- tapOn: "With me.*"

- extendedWaitUntil:
    visible: "With me.*"
    timeout: 5000

# Optional: tap the first list row by coordinate. If the demo account has no
# inbound shares, this falls on the empty-state copy and is harmless.
- tapOn:
    point: "50%,35%"

- takeScreenshot: "share-03-after-tap"

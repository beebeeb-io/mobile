appId: io.beebeeb.app
---
- launchApp

# Make sure we're on the Files tab and signed in
- tapOn:
    id: "tab-files"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

- takeScreenshot: "search-01-before"

# Tap the search icon at the top-right of the Files header.
# Was a coordinate tap; the header is being moved by the iOS 26 work, so it
# rots the same way the tab-bar taps did. testID added in FilesScreen.
- tapOn:
    id: "files-header-search"

# Search input has autoFocus — type the query
- inputText: "demo"

- takeScreenshot: "search-02-results"

# Verify search executed (screenshot captures results or empty state)

# Navigating to another tab and back is a reliable way to leave search;
# tapping the in-header Cancel triggers a flaky iOS background event in this build.
- tapOn:
    id: "tab-photos"
- extendedWaitUntil:
    visible: "Photos"
    timeout: 5000

- tapOn:
    id: "tab-files"
- extendedWaitUntil:
    visible: "Drive"
    timeout: 5000

- takeScreenshot: "search-03-after-cancel"

appId: io.beebeeb.app
---
- launchApp

# Make sure we're on the Files tab and signed in
- tapOn:
    id: "tab-files"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

- takeScreenshot: "search-01-before"

# 1357 review fix — the third state in the tab-bar-visibility family, beside
# "hidden while searching" and "restored on cancel" below: neither bar may
# ever be on screen at once. Real, verified-reachable repro (NOT a
# long-press — `enterSelectMode(item.id)` via long-press is not currently
# wired to any row's `onLongPress`, see FilesScreen.tsx's own note beside the
# tabBarStyle effect): enter select mode from plain browsing (the orb is
# still visible — select-mode-alone doesn't hide the tab bar), then open
# search via that still-visible orb. `action:'search'` sets `searchActive`
# without touching `selectMode`, so both land true together — the search bar
# stays unmounted (its own `!selectMode` gate), and a `searchActive`-only
# hide condition would leave the tab bar ALSO hidden: a dead end escapable
# only by leaving select mode.
# Task 1360 — INTERIM MITIGATION, pending a Maestro upgrade (see CLAUDE.md, "ROOT CAUSE
# FOUND"). Root cause is the installed Maestro 2.5.1 being four months stale — an isolated
# 2.10.0 binary passed this same flow 15/15 with zero retries where 2.5.1 failed 9/15. Until
# `~/.maestro` is upgraded (queued for Guus — shared install, not this workspace's call to
# make), the tap reports COMPLETED but the JS `onPress` never runs. This retries the ACTION,
# not the assertion below — the loop stops as soon as select mode is actually visible, and if
# it never is, `assertVisible` below still fails for real. Never widen that assertion to "fix"
# a red run here. Once `maestro --version` is past 2.5.1, remove this `repeat` wrapper and go
# back to a plain `tapOn`.
- repeat:
    times: 5
    while:
      notVisible:
        id: "select-mode-cancel"
    commands:
      - tapOn:
          id: "select-mode-enter"

# Synchronization checkpoint (lead's finding, 2026-09-03 02:57 failure):
# without this, the very next tap can fire before select mode has actually
# rendered, so `tab-search` sometimes lands while `searchActive` and
# `selectMode` are both still false — the assertions below would then pass
# for the WRONG reason (search-bar not visible because search never opened
# at all, not because the fix suppressed it). Asserting the select-mode
# header exists first makes the state real before the next tap depends on it.
- assertVisible:
    id: "select-mode-cancel"

- tapOn:
    id: "tab-search"

- assertNotVisible:
    id: "search-bar"

- assertVisible:
    id: "tab-photos"

# Leaving select mode (query/filter never touched — search was never
# actually shown) must restore the search bar and re-hide the tab bar,
# exactly the reverse transition.
- tapOn:
    id: "select-mode-cancel"

- assertVisible:
    id: "search-bar"

- assertNotVisible:
    id: "tab-photos"

# Task 1360 — interim mitigation, same stale-Maestro root cause as `select-mode-enter` above
# (remove once `~/.maestro` is past 2.5.1). `search-cancel` is confirmed affected too (lead's
# screenshot evidence, `2026-09-03_032136`). Retry the tap, not the assert.
#
# FIX (Codex review) — the while-condition below WAS `notVisible: id: "tab-photos"`, and that
# was a real bug, not just a style nit: `handleSearchToggle` is a TOGGLE
# (`setSearchActive((prev) => !prev)`), and `tab-photos`'s own visibility comes back through a
# `navigation.setOptions` effect (FilesScreen.tsx, the `tabBarStyle` useEffect) that runs ONE
# RENDER AFTER the one that actually clears `searchActive`. That gap is a real window: the tap
# already worked, `searchActive` is already false, but `tab-photos` hasn't appeared yet — the
# retry fires a second tap into that window, flips the toggle straight back, and REOPENS
# search. `search-bar` has no such gap: it's gated by `{searchActive && !selectMode && (...)}`
# directly in JSX (FilesScreen.tsx ~4463), so it unmounts on the exact same render that clears
# `searchActive` — no effect in between, no window for a live tap to land in. `tab-photos`
# stays as the real assertion below; only the retry's exit condition changed.
- repeat:
    times: 5
    while:
      visible:
        id: "search-bar"
    commands:
      - tapOn:
          id: "search-cancel"

- assertVisible:
    id: "tab-photos"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 5000

# 1338b — enter search via the iOS 26 orb beside the tab bar (task 1312),
# NOT the header icon. This is the entry point the redesigned bottom bar
# owns; 1308 later re-homes the entry into a native tab role without
# touching this UI.
- tapOn:
    id: "tab-search"

- assertVisible:
    id: "search-bar"

# The filter capsule row only exists once the new bottom bar ships (step b).
# On the old top-bar mode this element does not exist, so this is the RED
# assertion before the UI is built.
- assertVisible:
    id: "search-filters"

# 1357 — Guus's layout ruling: the bottom search bar REPLACES GlassTabBar in
# its own footprint, not floats above a still-visible one ("fill the menu
# bar at the bottom completely"). `tab-photos` lives inside GlassTabBar, so
# its absence is the real, discriminating proof the tab bar itself is gone —
# not just visually crowded by the search bar sitting in front of it.
- assertNotVisible:
    id: "tab-photos"

- takeScreenshot: "search-02-bar-empty"

# "clip" matches the seeded clip-1080p*.mp4 videos on the QA account.
- tapOn:
    id: "search-input"
- inputText: "clip"

- assertVisible:
    id: "search-results"

- assertVisible:
    id: "search-match"

- takeScreenshot: "search-03-results-highlighted"

# Discriminating step (this is NOT tautological — "clip" only ever matches
# the clip-1080p*.mp4 videos on this account, so a Videos-only assertion
# here would pass identically whether or not the capsule does anything).
# Photos has ZERO overlap with "clip": narrowing to it must empty the list.
# NOTE: `search-results` is the FlatList's OWN testID, present whenever
# search is showing results at all (query or kind filter) — it does not
# disappear for zero rows, only ListEmptyComponent's "No results" text
# appears instead. "No results" is the real discriminator here.
# Task 1360 — interim mitigation, same stale-Maestro root cause (see CLAUDE.md; remove once
# `~/.maestro` is past 2.5.1). `search-filter-photos`/`search-filter-videos` are the reproducer
# caught directly this session: `setSearchFilterKind` never ran on the failing taps. Retry the
# tap, not the assert.
- repeat:
    times: 5
    while:
      notVisible: "No results"
    commands:
      - tapOn:
          id: "search-filter-photos"

- assertVisible: "No results"

- assertNotVisible:
    id: "search-match"

- takeScreenshot: "search-04a-filtered-photos-empty"

# Narrow to Videos — the amber match must survive the narrower list, and
# switching capsules must actually re-narrow (proven by the Photos step
# above emptying the same query first).
# Task 1360 — same fault, same interim-mitigation shape (remove on Maestro upgrade).
- repeat:
    times: 5
    while:
      notVisible:
        id: "search-match"
    commands:
      - tapOn:
          id: "search-filter-videos"

- assertVisible:
    id: "search-results"

- assertVisible:
    id: "search-match"

- takeScreenshot: "search-04-filtered-videos"

# Cancel returns to plain Drive browsing — the bottom bar is gone, and the
# old top-bar mode does not reappear (there is only one search surface now).
#
# Task 1360 — interim mitigation (remove on Maestro upgrade); this is the second
# `search-cancel` occurrence in this flow, both are affected.
# NOTE: `notVisible: "Drive"` was tried here first and was WRONG — the folder title stays
# rendered in the header throughout active search, so that condition is already false before
# the tap and the whole repeat block gets SKIPPED (proven live: the skip left search-cancel
# never tapped at all, and the very next assertion failed for an unrelated reason). `search-bar`
# is the thing actually up before this tap and gone after, so that is the correct condition.
- repeat:
    times: 5
    while:
      visible:
        id: "search-bar"
    commands:
      - tapOn:
          id: "search-cancel"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 5000

- assertNotVisible:
    id: "search-bar"

# 1357 — the reverse of the tab-bar-hidden assertion above: cancel must
# restore GlassTabBar, not just clear the search surface.
- assertVisible:
    id: "tab-photos"

- takeScreenshot: "search-05-after-cancel"

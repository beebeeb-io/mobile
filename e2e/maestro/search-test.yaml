appId: io.beebeeb.app
---
- launchApp

# Make sure we're on the Files tab and signed in
- tapOn:
    id: "tab-files"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

- takeScreenshot: "search-01-before"

# 1338b — enter search via the iOS 26 orb beside the tab bar (task 1312),
# NOT the header icon. This is the entry point the redesigned bottom bar
# owns; 1308 later re-homes the entry into a native tab role without
# touching this UI.
- tapOn:
    id: "tab-search"

- assertVisible:
    id: "search-bar"

# The filter capsule row only exists once the new bottom bar ships (step b).
# On the old top-bar mode this element does not exist, so this is the RED
# assertion before the UI is built.
- assertVisible:
    id: "search-filters"

- takeScreenshot: "search-02-bar-empty"

# "clip" matches the seeded clip-1080p*.mp4 videos on the QA account.
- tapOn:
    id: "search-input"
- inputText: "clip"

- assertVisible:
    id: "search-results"

- assertVisible:
    id: "search-match"

- takeScreenshot: "search-03-results-highlighted"

# Narrow to Videos — the amber match must survive the narrower list.
- tapOn:
    id: "search-filter-videos"

- assertVisible:
    id: "search-results"

- assertVisible:
    id: "search-match"

- takeScreenshot: "search-04-filtered-videos"

# Cancel returns to plain Drive browsing — the bottom bar is gone, and the
# old top-bar mode does not reappear (there is only one search surface now).
- tapOn:
    id: "search-cancel"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 5000

- assertNotVisible:
    id: "search-bar"

- takeScreenshot: "search-05-after-cancel"

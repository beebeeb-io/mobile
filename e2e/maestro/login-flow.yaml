appId: io.beebeeb.app
---
- launchApp

# If already signed in, sign out first
- runFlow:
    when:
      visible: "Drive"
    commands:
      # Go to Settings tab
      - tapOn:
          point: "85%,95%"
      # Scroll to bottom where Sign out is
      - scroll
      - scroll
      - scroll
      # Tap Sign out (red text near bottom)
      - tapOn: "Sign out"
      # Confirm the alert
      - tapOn:
          text: "Sign out"
          index: 1

# Wait for login screen
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 15000

- takeScreenshot: "login-01-signin-screen"

# Enter credentials
- tapOn:
    id: "email-input"
- inputText: "demo@beebeeb.io"

- tapOn:
    id: "password-input"
- inputText: "demodemo12345678"

- tapOn:
    id: "sign-in-button"

# Handle recovery phrase onboarding if shown
- runFlow:
    when:
      visible: "Your recovery phrase"
    commands:
      - tapOn: "I'll do this later (not recommended)"

# Wait for main app
- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

- takeScreenshot: "login-02-files-after-login"

# Verify all tabs accessible
- tapOn:
    point: "35%,95%"
- takeScreenshot: "login-03-shared"

- tapOn:
    point: "60%,95%"
- takeScreenshot: "login-04-photos"

- tapOn:
    point: "85%,95%"
- takeScreenshot: "login-05-settings"

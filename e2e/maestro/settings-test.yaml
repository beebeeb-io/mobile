appId: io.beebeeb.app
---
- launchApp

# Should be on Files tab (already logged in)
- extendedWaitUntil:
    visible: "Drive"
    timeout: 10000

# Navigate to Settings tab.
# 1308d — task 1360: `id: "tab-settings"` against the native SwiftUI tab bar
# (1308a) is unreliable here — a hard "Element not found" even though
# `maestro hierarchy` dumped moments earlier shows `resource-id:
# "tab-settings"` genuinely present. A plain TEXT selector on the tab's own
# label resolved and tapped correctly 3/3 runs with zero waiting instead —
# see login-test.yaml for the full live comparison (repeat/wait wrappers
# tried and ruled out) and docs/maestro-driver-fault-1360.md for the general
# fault this native-tab-bar variant sits beside.
- tapOn: "Settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000

- takeScreenshot: "settings-01-top"

# Scroll down to reveal more settings
- scroll

- takeScreenshot: "settings-02-mid-about"

# Scroll down more to reveal data residency / legal links
- scroll

- takeScreenshot: "settings-03-bottom-legal"

appId: io.beebeeb.app
---
- launchApp

# Make sure we're on the Files tab and signed in
- tapOn:
    id: "tab-files"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

# Go to Settings
- tapOn:
    id: "tab-settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

# Scroll to the Appearance control and pick Dark. The row itself is driven by
# the stable `appearance-{light,dark,system}` testIDs (task 1352), not by the
# old "Dark theme.*" text match this flow used to make — nothing about dark
# mode itself is broken, the redesign just turns the control into icon
# buttons the old selector no longer reliably drives.
#
# scrollUntilVisible still targets TEXT, not `id:`, and that's deliberate:
# verified directly (three cold-launch runs) that `scrollUntilVisible` +
# `tapOn` with an `id:` selector fail to locate this row while it's still
# off-screen — id lookups work fine once the row is already on screen, but
# not while scrollUntilVisible is actively paging down to reach it. Text
# scrolling has no such issue and this row's accessibilityLabel ("Dark
# theme"/"Light theme"/"System theme") is stable and current — this is the
# CLAUDE.md-sanctioned fallback ("Use id: where you can, and a .*-anchored
# regex where you must"), not a reversion to the original bug.
#
# Trap that still applies: target the option itself, not the "Appearance"
# section header — the header scrolls into view while the control is still
# below the fold (this screen now starts with Account/Storage/Backup/Devices
# above it, so real scrolling is required from a cold launch), so scrolling
# to the header and then tapping fails.
- scrollUntilVisible:
    element:
      text: "Dark theme.*"
    direction: DOWN
    timeout: 15000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- tapOn:
    id: "appearance-dark"

# Real assertion that dark actually applied, not just that a control was
# tapped. `themePreference` (SettingsScreen.tsx) and the derived `resolved`
# scheme (theme-context.tsx) are set synchronously from the same state update,
# so the accessibilityLabel below only reads "Dark theme, selected" once the
# app has genuinely switched — a no-op tap leaves it at "Dark theme" and this
# assertion (matched by id AND text together) fails the run.
- assertVisible:
    id: "appearance-dark"
    text: "Dark theme, selected"

- takeScreenshot: "dark-01-settings"

# Visit each tab in dark mode
- tapOn:
    id: "tab-files"
- extendedWaitUntil:
    visible: "Drive"
    timeout: 5000
- takeScreenshot: "dark-02-files"

- tapOn:
    id: "tab-shared"
- takeScreenshot: "dark-03-shared"

- tapOn:
    id: "tab-photos"
- extendedWaitUntil:
    visible: "Photos"
    timeout: 5000
- takeScreenshot: "dark-04-photos"

- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000
- takeScreenshot: "dark-05-settings"

# Switch back to System theme so the device is left in a clean state
- scrollUntilVisible:
    element:
      text: "System theme.*"
    direction: DOWN
    timeout: 15000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- tapOn:
    id: "appearance-system"

- assertVisible:
    id: "appearance-system"
    text: "System theme, selected"

- takeScreenshot: "dark-06-back-to-system"

appId: io.beebeeb.app
---
- launchApp

# Make sure we're on the Files tab and signed in
- tapOn:
    id: "tab-files"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

# Go to Settings
- tapOn:
    id: "tab-settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

# Scroll to the Appearance control and pick Dark. Two traps here, both
# pre-dating the tab-bar work (this fails the same way on ab20926):
#  1. Target the option, not the "Appearance" section header — the header
#     scrolls into view while the Light/Dark/System control is still below
#     the fold, so scrolling to it and then tapping fails.
#  2. The option's accessibilityLabel is "Dark theme" (plus ", selected" when
#     active), NOT "Dark". Maestro's text selector is a FULL-match regex, so
#     "Dark" never matches. Hence "Dark theme.*".
- scrollUntilVisible:
    element:
      text: "Dark theme.*"
    direction: DOWN
    timeout: 10000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- tapOn: "Dark theme.*"

- takeScreenshot: "dark-01-settings"

# Visit each tab in dark mode
- tapOn:
    id: "tab-files"
- extendedWaitUntil:
    visible: "Drive"
    timeout: 5000
- takeScreenshot: "dark-02-files"

- tapOn:
    id: "tab-shared"
- takeScreenshot: "dark-03-shared"

- tapOn:
    id: "tab-photos"
- extendedWaitUntil:
    visible: "Photos"
    timeout: 5000
- takeScreenshot: "dark-04-photos"

- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000
- takeScreenshot: "dark-05-settings"

# Switch back to System theme so the device is left in a clean state
- scrollUntilVisible:
    element:
      text: "System theme.*"
    direction: DOWN
    timeout: 10000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- tapOn: "System theme.*"

- takeScreenshot: "dark-06-back-to-system"

appId: io.beebeeb.app
---
- launchApp

# Should be on Files tab (already logged in)
- extendedWaitUntil:
    visible: "Drive"
    timeout: 10000
- takeScreenshot: "01-files-drive"

# Tap Shared tab
- tapOn:
    id: "tab-shared"
- takeScreenshot: "02-shared"

# Tap Settings tab
- tapOn:
    id: "tab-settings"
- takeScreenshot: "04-settings"

# Scroll down in settings
- scroll
- takeScreenshot: "05-settings-scrolled"

# Scroll down more to see About section
- scroll
- takeScreenshot: "06-settings-bottom"

# Tap Files tab
- tapOn:
    id: "tab-files"
- extendedWaitUntil:
    visible: "Drive"
    timeout: 5000
- takeScreenshot: "07-files-final"

# Photos LAST, deliberately. Task 1321: visiting Photos raises a pre-existing
# "thumbnail.ts iOS path replaced by BeebeebThumbnails" rejection, and in a dev
# build the LogBox redbox then covers the screen and blocks every later
# assertion. It reproduces on main without this branch's changes. Ordering
# Photos last keeps the tour complete without asserting through the redbox.
# Restore this to its original position once 1321 is fixed.
- tapOn:
    id: "tab-photos"
- takeScreenshot: "03-photos"

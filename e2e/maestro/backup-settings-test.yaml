appId: io.beebeeb.app
---
- launchApp

# Should be on Files tab (already logged in)
- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

# Navigate to Settings tab.
# 1308d — task 1360: `id: "tab-settings"` against the native SwiftUI tab bar
# (1308a) is unreliable here in a way distinct from the documented RN-content
# fault — a hard "Element not found" even though `maestro hierarchy` dumped
# moments earlier shows `resource-id: "tab-settings"` genuinely present. Ruled
# out live before landing on this fix: wrapping in `repeat...while` (a hard
# "not found" isn't retried the way a no-op COMPLETED is), `extendedWaitUntil`
# on the element for up to 8s (still fails — not a brief attach delay), and a
# benign text warm-up tap first (still fails). A plain TEXT selector on the
# tab's own label resolved and tapped correctly 3/3 runs with zero waiting —
# see login-test.yaml for the full comparison. `tapOn: "Settings"` is a single
# exact `accessibilityText` match on the Drive screen (verified via hierarchy
# dump). See docs/maestro-driver-fault-1360.md for the general fault this
# native-tab-bar variant sits beside.
- tapOn: "Settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

# Scroll to the Backup section
- scrollUntilVisible:
    element:
      text: "Backup"
    direction: DOWN
    timeout: 10000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- takeScreenshot: "backup-01-section-header"

# All three backup categories must be present
- assertVisible: "Back up camera roll"

- scrollUntilVisible:
    element:
      text: "Back up contacts"
    direction: DOWN
    timeout: 5000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- assertVisible: "Back up contacts"

- scrollUntilVisible:
    element:
      text: "Back up calendar"
    direction: DOWN
    timeout: 5000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- assertVisible: "Back up calendar"

- takeScreenshot: "backup-02-toggles"

appId: io.beebeeb.app
---
- launchApp

# Should be on Files tab (already logged in)
- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

# Navigate to Settings tab
- tapOn:
    id: "tab-settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

# Scroll to the Backup section
- scrollUntilVisible:
    element:
      text: "Backup"
    direction: DOWN
    timeout: 10000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- takeScreenshot: "backup-01-section-header"

# All three backup categories must be present
- assertVisible: "Back up camera roll"

- scrollUntilVisible:
    element:
      text: "Back up contacts"
    direction: DOWN
    timeout: 5000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- assertVisible: "Back up contacts"

- scrollUntilVisible:
    element:
      text: "Back up calendar"
    direction: DOWN
    timeout: 5000
    # centerElement: the floating tab bar (task 1312) overlays the bottom ~110pt
    # of every scrollable screen, and scrollUntilVisible has no concept of it —
    # it stops as soon as the target is inside the SCROLL VIEW's bounds, which
    # includes the region hidden behind the capsule. The subsequent tap then
    # lands on the tab bar instead of the row. Centering guarantees the target
    # clears the chrome. Required for any scrollUntilVisible on a tabbed screen.
    centerElement: true

- assertVisible: "Back up calendar"

- takeScreenshot: "backup-02-toggles"

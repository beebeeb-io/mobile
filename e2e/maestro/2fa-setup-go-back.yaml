appId: io.beebeeb.app
---
# 2FA setup must not trap the user on the Verify step (iOS core journeys, P1).
# Precondition: signed in, 2FA NOT enabled on the account, local API.
# RED on main caa7385: `tapOn: "Go back"` on the Verify step fails with
# "Element not found" — the gate blocked every removal from step 2 onward.
# GREEN: Back on step 2 returns to step 1 with the same secret on screen.
- launchApp

- extendedWaitUntil:
    visible: "Drive"
    timeout: 10000

- tapOn: "Settings"
- scrollUntilVisible:
    element: "Two-Factor Authentication"
    direction: DOWN
- tapOn: "Two-Factor Authentication"

- extendedWaitUntil:
    visible: "Set up authenticator"
    timeout: 10000
- tapOn: "Continue"

# Step 2: Verify. Back must be offered here.
- extendedWaitUntil:
    visible: "Verify"
    timeout: 5000
- tapOn: "Go back"
- waitForAnimationToEnd

# Back on step 1: the secret (and its copy action) is visible again.
- assertVisible: "Set up authenticator"
- assertVisible: "Copy secret"
- assertVisible: "Continue"
- takeScreenshot: "2fa-setup-go-back-step1"

appId: io.beebeeb.app
env:
  FOLDER_NAME: qa-1381-native-fab
---
# Local QA account, signed in and unlocked. Delete this own fixture after capture.
- launchApp
- extendedWaitUntil:
    visible: "Drive"
    timeout: 10000
- tapOn:
    id: "fab-add"
- tapOn: "New folder"
- inputText: "${FOLDER_NAME}"
- tapOn: "OK"
- extendedWaitUntil:
    visible: "${FOLDER_NAME}"
    timeout: 10000

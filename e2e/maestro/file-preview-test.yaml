appId: io.beebeeb.app
---
- launchApp

# Make sure we're on the Files tab and signed in
- tapOn:
    id: "tab-files"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 15000

- takeScreenshot: "preview-01-files-list"

# Open a FILE, not a folder.
#
# This used to prefer "Welcome.pdf" and fall back to `point: "50%,40%"`. Neither
# worked on the QA account: Welcome.pdf exists only in the DEMO account, and at
# root y=40% lands on the "Backups" FOLDER row — so the flow navigated into a
# folder and no preview ever opened. That is why it failed before the redesign
# as well; it has nothing to do with the chrome.
#
# It then moved to matching a filename EXTENSION as free text (account-agnostic:
# folders do not have one) — but that regex is a FULL match against ANY visible
# accessible name ending in a supported extension, and two other things end in
# one too: the "Recent" section's cards ("Open recent file <name>.<ext>", which
# render ABOVE the list and have no id) and the row's own "..." actions button
# ("Actions for <name>.<ext>", `file-row-actions-${id}`). Both are earlier in
# the hierarchy than a genuine row for some layouts, so the tap could land on
# either — reproduced directly (`maestro hierarchy` + the resolved-element log
# line both showed a Recent card getting tapped, not a row; task 1350).
#
# `file-row-${id}` (task 1350, FilesScreen.tsx) is set on FILE rows only —
# folders and the Recent cards carry no id at all, so they're excluded by
# construction, and the regex is anchored to hex right after `file-row-` so it
# cannot match `file-row-actions-${id}` (`a`/`c` are hex but "tions-" isn't).
- tapOn:
    id: "file-row-[0-9a-f]{8}-.*"

# Preview is open. There are TWO preview headers — a "×" for documents and a
# chevron for media — so assert the shared testID rather than either glyph.
- extendedWaitUntil:
    visible:
      id: "preview-close"
    timeout: 10000

- takeScreenshot: "preview-02-open"

# Task 1360 — INTERIM MITIGATION, pending a Maestro upgrade (see CLAUDE.md, "ROOT CAUSE
# FOUND"). This is the flow behind task 1355, which was misdiagnosed as a possible product bug
# ("a preview you cannot leave") until instrumented logging proved the touch never reached
# `handleClose` — 9 of 15 runs on this flow failed this exact tap on the installed Maestro
# 2.5.1, and an isolated 2.10.0 binary passed the identical flow 15/15 with zero retries.
# `~/.maestro` upgrade is queued for Guus (shared install, other projects depend on it); until
# then this retries the ACTION, not the assertion below — the loop stops as soon as "Drive" is
# actually visible, and if it never is, `extendedWaitUntil` below still fails for real. Never
# widen that wait to "fix" a red run here. Once `maestro --version` is past 2.5.1, remove this
# `repeat` wrapper and go back to a plain `tapOn`.
- repeat:
    times: 5
    while:
      notVisible: "Drive"
    commands:
      - tapOn:
          id: "preview-close"

- extendedWaitUntil:
    visible: "Drive"
    timeout: 5000

- takeScreenshot: "preview-03-back-on-files"

name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - run: bunx tsc --noEmit

  claims-guard:
    name: Claims guard
    runs-on: ubuntu-latest
    # Phased rollout (plan 2026-09-06-premortem-05-claims-regression-ci-guard,
    # Task 2 sequencing): mobile still vendors three.js from unpkg.com and lists
    # helsinki-fi/ede-nl in SettingsScreen.tsx (plan Task 7). Promote once
    # `bash scripts/claims-guard/claims-guard.sh` exits 0 here.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run claims guard
        run: bash scripts/claims-guard/claims-guard.sh

  # Task 1671: until this job NO Swift was compiled in CI. Public repo, so
  # macOS runners are free. Typechecks the Share Extension exactly as the
  # BeebeebShare target compiles it (file list read from project.pbxproj),
  # against the iOS simulator SDK, for both ios/BeebeebShare/ and the
  # targets/share-extension/ source of truth, checks the two stay
  # byte-identical, then compiles and runs every scripts/swift-tests driver.
  swift-gate:
    name: Swift compile gate
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Typecheck Share Extension (xcodeproj copy, targets/ source, sync check)
        run: bash scripts/swift-ci/typecheck-share-extension.sh
      - name: Swift unit tests (scripts/swift-tests)
        if: ${{ !cancelled() }}
        run: bash scripts/swift-ci/run-swift-tests.sh
